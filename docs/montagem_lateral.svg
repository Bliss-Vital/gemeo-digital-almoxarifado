<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Montagem da caixa sobre a balança (vista de lado)</title>
  <rect x="0.5" y="0.5" width="959" height="359" rx="12" fill="#ffffff" stroke="#d5d9de"/>
  <text x="24" y="38" font-size="20" font-weight="700" fill="#1b1f24">Montagem (vista de lado)</text>

  <!-- mesa -->
  <line x1="24" y1="300" x2="936" y2="300" stroke="#6b7580" stroke-width="3"/>
  <text x="936" y="326" font-size="12.5" fill="#4b5560" text-anchor="end">mesa firme e plana (sem toalha ou tapete)</text>

  <!-- pés com as células -->
  <rect x="160" y="280" width="44" height="20" rx="3" fill="#c9ced4" stroke="#6b7580"/>
  <rect x="536" y="280" width="44" height="20" rx="3" fill="#c9ced4" stroke="#6b7580"/>

  <!-- plataforma -->
  <rect x="140" y="262" width="460" height="18" rx="4" fill="#cfe3f0" stroke="#6a8fa8" stroke-width="1.5"/>

  <!-- caixa bin -->
  <path d="M232 262 L222 168 H518 L508 262 Z" fill="#f2b20f" stroke="#a87800" stroke-width="1.5"/>
  <rect x="300" y="196" width="140" height="36" rx="4" fill="#ffffff" stroke="#a87800"/>
  <text x="370" y="219" font-size="14" font-weight="700" fill="#1b1f24" text-anchor="middle">PROTO-01</text>
  <g fill="#8a929b" stroke="#5b636c">
    <rect x="250" y="240" width="34" height="18" rx="3"/><rect x="290" y="240" width="34" height="18" rx="3"/>
    <rect x="416" y="240" width="34" height="18" rx="3"/><rect x="456" y="240" width="34" height="18" rx="3"/>
  </g>

  <!-- eletrônica -->
  <rect x="712" y="236" width="150" height="64" rx="6" fill="#1f2937"/>
  <text x="787" y="265" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ESP32 + HX711</text>
  <text x="787" y="284" font-size="11.5" fill="#aab4bf" text-anchor="middle">numa caixinha</text>
  <path d="M580 292 C640 292 650 270 712 270" fill="none" stroke="#1f1f1f" stroke-width="3"/>
  <path d="M862 268 H930" fill="none" stroke="#5b636c" stroke-width="6" stroke-linecap="round"/>
  <text x="896" y="256" font-size="12" fill="#1b1f24" text-anchor="middle">USB</text>

  <!-- legendas -->
  <g font-size="12.5" fill="#1b1f24">
    <line x1="370" y1="168" x2="370" y2="104" stroke="#6b7580"/>
    <text x="370" y="96" text-anchor="middle">caixa bin no centro da plataforma</text>
    <line x1="86" y1="238" x2="150" y2="265" stroke="#6b7580"/>
    <text x="24" y="214">plataforma = vidro</text>
    <text x="24" y="231">da própria balança</text>
    <line x1="182" y1="300" x2="182" y2="342" stroke="#6b7580"/>
    <text x="192" y="346">célula de carga em cada pé (4 no total)</text>
    <line x1="640" y1="284" x2="640" y2="176" stroke="#6b7580"/>
    <text x="646" y="154">4 fios, sem esticar</text>
    <text x="646" y="172" fill="#4b5560">a eletrônica fica fora da plataforma</text>
  </g>
  <g font-size="12.5" fill="#b42318">
    <text x="24" y="96" font-weight="700">Só os 4 pés podem tocar a mesa.</text>
    <text x="24" y="115">Fio, parede ou caixinha encostando</text>
    <text x="24" y="132">na plataforma rouba peso da leitura.</text>
  </g>
</svg>
