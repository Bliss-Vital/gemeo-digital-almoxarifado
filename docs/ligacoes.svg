<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Ligações: células de carga → HX711 → ESP32</title>
  <rect x="0.5" y="0.5" width="959" height="449" rx="12" fill="#ffffff" stroke="#d5d9de"/>
  <text x="24" y="38" font-size="20" font-weight="700" fill="#1b1f24">Ligações da caixa inteligente</text>
  <text x="24" y="60" font-size="13" fill="#4b5560">Os fios das células vão no HX711; o HX711 vai no ESP32; o ESP32 vai no USB.</text>

  <!-- Balança -->
  <rect x="30" y="90" width="200" height="200" rx="10" fill="#eef1f4" stroke="#9aa3ad" stroke-width="1.5"/>
  <g fill="#c9ced4" stroke="#6b7580" stroke-width="1.2">
    <rect x="42" y="102" width="24" height="24" rx="4"/><rect x="194" y="102" width="24" height="24" rx="4"/>
    <rect x="42" y="254" width="24" height="24" rx="4"/><rect x="194" y="254" width="24" height="24" rx="4"/>
  </g>
  <text x="130" y="176" font-size="15" font-weight="700" fill="#1b1f24" text-anchor="middle">Balança</text>
  <text x="130" y="195" font-size="12" fill="#4b5560" text-anchor="middle">vista de baixo</text>
  <text x="130" y="312" font-size="12.5" fill="#1b1f24" text-anchor="middle">4 células de carga, uma em cada pé</text>
  <text x="130" y="330" font-size="12" fill="#4b5560" text-anchor="middle">(os 4 fios que iam na placa TB-400V20)</text>

  <!-- fios das células -> HX711 -->
  <line x1="230" y1="140" x2="380" y2="140" stroke="#d62828" stroke-width="4" stroke-linecap="round"/>
  <line x1="230" y1="170" x2="380" y2="170" stroke="#1f1f1f" stroke-width="4" stroke-linecap="round"/>
  <line x1="230" y1="200" x2="380" y2="200" stroke="#2a9d4b" stroke-width="4" stroke-linecap="round"/>
  <line x1="230" y1="230" x2="380" y2="230" stroke="#5b636c" stroke-width="6" stroke-linecap="round"/>
  <line x1="230" y1="230" x2="380" y2="230" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <g font-size="12" fill="#1b1f24" text-anchor="middle">
    <text x="305" y="133">E+ · vermelho</text>
    <text x="305" y="163">E− · preto</text>
    <text x="305" y="193">S+ · verde</text>
    <text x="305" y="223">S− · branco</text>
  </g>

  <!-- HX711 -->
  <rect x="380" y="100" width="170" height="250" rx="8" fill="#2f7d3a" stroke="#1d5426" stroke-width="1.5"/>
  <rect x="440" y="200" width="50" height="34" rx="3" fill="#1b1f24"/>
  <text x="465" y="262" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">HX711</text>
  <g fill="#e5c07b" stroke="#8a6d1f" stroke-width="1.2">
    <circle cx="380" cy="140" r="5"/><circle cx="380" cy="170" r="5"/><circle cx="380" cy="200" r="5"/><circle cx="380" cy="230" r="5"/>
    <circle cx="380" cy="280" r="5" fill="#9aa3ad" stroke="#5b636c"/><circle cx="380" cy="310" r="5" fill="#9aa3ad" stroke="#5b636c"/>
    <circle cx="550" cy="150" r="5"/><circle cx="550" cy="190" r="5"/><circle cx="550" cy="230" r="5"/><circle cx="550" cy="270" r="5"/>
  </g>
  <g font-size="12.5" font-weight="600" fill="#ffffff">
    <text x="392" y="144">E+</text><text x="392" y="174">E−</text><text x="392" y="204">A+</text><text x="392" y="234">A−</text>
    <text x="392" y="284" fill="#c8d6c9">B+  (não usar)</text><text x="392" y="314" fill="#c8d6c9">B−  (não usar)</text>
  </g>
  <g font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="end">
    <text x="538" y="154">VCC</text><text x="538" y="194">SCK</text><text x="538" y="234">DT</text><text x="538" y="274">GND</text>
  </g>

  <!-- HX711 -> ESP32 -->
  <line x1="550" y1="150" x2="720" y2="150" stroke="#d62828" stroke-width="4" stroke-linecap="round"/>
  <line x1="550" y1="190" x2="720" y2="190" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="550" y1="230" x2="720" y2="230" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
  <line x1="550" y1="270" x2="720" y2="270" stroke="#1f1f1f" stroke-width="4" stroke-linecap="round"/>
  <g font-size="12" fill="#1b1f24" text-anchor="middle">
    <text x="635" y="143">VCC → 3V3</text>
    <text x="635" y="183">SCK → GPIO 4</text>
    <text x="635" y="223">DT → GPIO 16</text>
    <text x="635" y="263">GND → GND</text>
  </g>

  <!-- ESP32 -->
  <rect x="720" y="90" width="210" height="270" rx="8" fill="#1f2937" stroke="#0f141b" stroke-width="1.5"/>
  <rect x="800" y="104" width="112" height="70" rx="4" fill="#b8bec6" stroke="#6b7580"/>
  <text x="856" y="144" font-size="12" font-weight="700" fill="#1b1f24" text-anchor="middle">ESP32</text>
  <g fill="#e5c07b" stroke="#8a6d1f" stroke-width="1.2">
    <circle cx="720" cy="150" r="5"/><circle cx="720" cy="190" r="5"/><circle cx="720" cy="230" r="5"/><circle cx="720" cy="270" r="5"/>
  </g>
  <g font-size="12.5" font-weight="600" fill="#ffffff">
    <text x="732" y="154">3V3</text>
    <text x="732" y="194">GPIO 4 <tspan fill="#aab4bf" font-weight="400">(D4)</tspan></text>
    <text x="732" y="234">GPIO 16 <tspan fill="#aab4bf" font-weight="400">(RX2)</tspan></text>
    <text x="732" y="274">GND</text>
  </g>
  <text x="825" y="320" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ESP32 DevKit</text>
  <rect x="805" y="348" width="40" height="18" rx="3" fill="#8a929b" stroke="#4b5560"/>
  <path d="M825 366 V400 H900" fill="none" stroke="#5b636c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="930" y="425" font-size="12.5" fill="#1b1f24" text-anchor="end">Cabo USB: computador ou carregador 5 V</text>

  <!-- avisos -->
  <g font-size="12.5" fill="#1b1f24">
    <text x="30" y="378"><tspan font-weight="700">Não use:</tspan> os fios V+ e V− da placa antiga (eram da pilha) e os pinos B+ / B− do HX711.</text>
    <text x="30" y="400"><tspan font-weight="700">Atenção:</tspan> VCC do HX711 no <tspan font-weight="700">3V3</tspan> do ESP32, nunca no 5V/VIN.</text>
    <text x="30" y="422" fill="#4b5560">Na placa de 30 pinos, GPIO 16 aparece como RX2 e GPIO 4 como D4.</text>
  </g>
</svg>
